[build-system]
requires = ['setuptools>=61.0.0', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'AndroidsSystemFileChooser'
version = '1.10'
description = 'Androids SystemFileChooser with Kivy'
readme = 'README.md'
requires-python = '>=3.10'
license = 'MIT'
license-files = ['LICENSE']
authors = [
    { name = 'kuzeyron/kuz3yr0n and other contributors', email = 'globalkuzeyron@gmail.com' },
]
classifiers = [
    'Intended Audience :: Developers',
    'Topic :: Software Development :: Build Tools',
    'Programming Language :: Python :: 3'
]

[project.urls]
Source = 'https://github.com/kuz3yr0n/AndroidsSystemFileChooser'
'Bug Reports' = 'https://github.com/kuz3yr0n/AndroidsSystemFileChooser/issues'

[tool.setuptools.packages.find]
where = ['src']

[tool.ruff]
exclude = [
    '__pycache__',
    '.tox',
    '.git/',
    'doc/',
    'build/',
    '.eggs/',
    'venv/',
]
lint.extend-ignore = [
    'E402',
    'E722',
    'E731',
    'E741',
    'F401',
    'F841',
]
lint.select = [
    'E',
    'F',
    'W',
]
